# Does an agent reading "Choose the API" reach the decisions that section exists to force?
#
# Each test is a situation plus a closed decision. Positive tests check the rule fires;
# negative tests (json-already-stated, ts-already-stated) check it does NOT over-fire.
# Mutations are the edits a careless rewrite could make — each one must break the tests
# listed under `kills`, or the tests are not guarding anything.

file: SKILL.md
section: Choose the API

tests:
  - id: ask-when-unspecified
    scenario: The user says "make me a signup form in React" and nothing else about how the form should be authored.
    question: What should the agent do first?
    options:
      ask: Stop and ask the user which API they want (TS API or JSON API) before writing any form code
      ts: Start writing the form with the TS API (gui.*)
      json: Start writing the form as a JSON definition
      # Without this option "ask" wins by elimination even when the skill says nothing,
      # and the mutation that removes the gate can never be detected.
      unspecified: The skill does not say what to do when the request names neither API
    expect: ask

  - id: json-already-stated
    scenario: The user says "give me a JSON form definition for a signup form that we can store in our database".
    question: What should the agent do first?
    options:
      ask: Stop and ask the user which API they want before writing any form code
      ts: Write the form with the TS API (gui.*)
      json: Write the form as a JSON definition
    expect: json

  - id: json-implied
    # Several ways users describe a form that is data, none of which names JSON, TS or an API,
    # and none of which repeats the skill's own examples. The verdict is the median variant's.
    # Kept deliberately away from the skill's own examples ("served from our backend",
    # "a .json file per form"...): a variant that repeats an example passes with the examples
    # alone and cannot show that the criterion sentence is needed.
    scenario:
      - The user says "the same form has to be rendered by our web app and by the mobile team's app, which is not written in TypeScript".
      - The user says "product managers will tweak the questions themselves, without a deploy".
      - The user says "legal has to sign off every version of the questionnaire before it goes live".
      - The user says "the questionnaire changes every quarter and we need to diff one version against the previous one".
    question: What should the agent do first?
    options:
      ask: Stop and ask the user which API they want before writing any form code
      ts: Write the form with the TS API (gui.*)
      json: Write the form as a JSON definition
    expect: json

  - id: ts-implied
    scenario:
      - The user says "the form goes in the same file as the component that renders it, so it gets refactored together with the rest of the code".
      - The user says "I want the compiler to catch a wrong option name before I even run it".
      - The user says "we build the fields in a loop from our domain model, inside the module".
    question: What should the agent do first?
    options:
      ask: Stop and ask the user which API they want before writing any form code
      ts: Write the form with the TS API (gui.*)
      json: Write the form as a JSON definition
    expect: ts

  - id: ts-already-stated
    scenario: The user says "write the signup form with the gui.* builder in TypeScript".
    question: What should the agent do first?
    options:
      ask: Stop and ask the user which API they want before writing any form code
      ts: Write the form with the TS API (gui.*)
      json: Write the form as a JSON definition
    expect: ts

  - id: autonomous-no-default
    scenario: The agent is running autonomously with nobody available to answer questions, and the request does not say which API to use.
    question: According to the skill, is the agent allowed to pick an API by itself and continue?
    expect: no

  - id: obvious-still-ask
    scenario: The request does not name an API, but from the context the TS API is clearly the better fit.
    question: May the agent go ahead with the TS API without asking, because the choice seems obvious?
    expect: no

  - id: how-to-ask
    scenario: The agent has decided it must ask the user which API they want, and the AskUserQuestion tool is available.
    question: How does the skill say the agent should ask?
    options:
      tool: Use the AskUserQuestion tool
      prose: Ask in plain text in its reply
      unspecified: The skill does not say how to ask
    expect: tool

  - id: which-apis-exist
    scenario: The user asks "what are my options for authoring a form with GolemUI?"
    question: Which answer matches the skill?
    options:
      ts-only: Only the TS API (gui.*)
      json-only: Only a JSON definition
      ts-or-json: Either the TS API (gui.*) or a JSON definition
      three-or-more: The TS API, a JSON definition, or HTML templates
    expect: ts-or-json

  - id: runtime-served-is-json
    scenario: The forms must be stored in a backend and served to the client at runtime. The user asks which API fits that.
    question: Which API does the skill point to?
    options:
      ts: The TS API (gui.*)
      json: The JSON API (a serializable document)
      either: The skill gives no guidance for this case
    expect: json

  - id: coded-is-ts
    scenario: The team wants to code its forms programmatically in TypeScript, in the application source, with the builder's types.
    question: Which API does the skill describe for that?
    options:
      ts: The TS API (gui.*)
      json: The JSON API (a serializable document)
      either: The skill gives no guidance for this case
    expect: ts

  - id: no-mixing
    scenario: The agent has written a form with gui.* and wants to add one more field as a JSON item inside the same file.
    question: Does the skill allow mixing both syntaxes in one artifact?
    expect: no

  - id: reference-for-ts
    scenario: The user chose the TS API and the agent is about to write the form.
    question: Which reference does the skill tell the agent to read?
    options:
      forms-dx: references/forms-dx.md
      forms-json: references/forms-json.md
      both: Both references
    expect: forms-dx

  - id: read-once
    scenario: The agent is writing a TS API form and keeps re-opening references/forms-dx.md for each field.
    question: What does the skill say about how to use forms-dx.md?
    options:
      once: Read it once and write the whole form from it
      per-field: Look up each factory as it is needed
      unspecified: The skill does not say
    expect: once

  - id: docs-url-json
    scenario: The agent is writing a JSON definition and needs the docs page for a widget.
    question: Which docs URL flavor should it fetch?
    options:
      dx: golemui.com/dx/<page>.md
      json: golemui.com/json/<page>.md
      either: Either one, the content is the same
    expect: json

mutations:
  - id: allow-silent-default
    note: The most likely "simplification" — someone removes the no-default rule.
    replace:
      - find: "There is NO default — never pick one silently, even when operating autonomously, even if one seems obvious."
        with: "When operating autonomously, or when one API is clearly the better fit, pick it and continue."
    kills: [autonomous-no-default, obvious-still-ask]

  - id: drop-the-gate
    note: The hard gate and the ask rule both disappear; only the two API descriptions remain.
    replace:
      - find: "**HARD GATE — do not write a single line of form code until the user has told you which API they want.** If the current request doesn't already state it, you MUST stop and ask (use the AskUserQuestion tool when available):"
        with: "Pick whichever fits the request:"
      - find: "There is NO default — never pick one silently, even when operating autonomously, even if one seems obvious."
        with: ""
      - find: "Ask ONLY when the request says nothing about either — \"make me a signup form in React\" says how it renders, not how it is authored."
        with: ""
      - find: "**The request already states the API — do NOT ask, go ahead — when it names one, or when it describes what the form IS in a way only one of them fits:**"
        with: "**Which API the request calls for:**"
    kills: [ask-when-unspecified, how-to-ask, autonomous-no-default]

  - id: drop-already-stated
    note: The block that says when NOT to ask disappears; the gate alone makes agents over-ask.
    replace:
      - find: "**The request already states the API — do NOT ask, go ahead — when it names one, or when it describes what the form IS in a way only one of them fits:**"
        with: ""
      - find: "- The form is **data that lives outside the code** — stored, served, versioned, generated by a tool, edited without recompiling, or shared by more than one app or stack → **JSON API**. (e.g. \"a JSON definition\", \"served from our backend\", \"produced by an authoring tool\", \"a `.json` file per form\")"
        with: ""
      - find: "- The form is **code that lives in the application** — built inside a component or module, next to the code that uses it, compiled, type-checked and refactored together with it → **TS API**. (e.g. \"with `gui.*`\", \"an imperative form\", \"in TypeScript with autocomplete\")"
        with: ""
      - find: "The examples are illustrations, not a list to match: judge by the criterion. Ask ONLY when the request says nothing about either — \"make me a signup form in React\" says how it renders, not how it is authored."
        with: ""
    kills: [json-already-stated, json-implied, ts-implied]

  - id: examples-only
    note: The criterion is cut and only the example phrases remain — the version we had before.
    replace:
      - find: "The form is **data that lives outside the code** — stored, served, versioned, generated by a tool, edited without recompiling, or shared by more than one app or stack → **JSON API**."
        with: "→ **JSON API**:"
      - find: "The form is **code that lives in the application** — built inside a component or module, next to the code that uses it, compiled, type-checked and refactored together with it → **TS API**."
        with: "→ **TS API**:"
      - find: "The examples are illustrations, not a list to match: judge by the criterion."
        with: ""
    kills: [json-implied, ts-implied]

  - id: swap-references
    note: The reference links get crossed.
    replace:
      - find: "forms-dx.md"
        with: "@@SWAP@@"
      - find: "forms-json.md"
        with: "forms-dx.md"
      - find: "@@SWAP@@"
        with: "forms-json.md"
    kills: [reference-for-ts]

  - id: allow-mixing
    replace:
      - find: "Never mix their syntaxes in one artifact:"
        with: "Mixing their syntaxes in one artifact is fine:"
    kills: [no-mixing]

  - id: swap-docs-flavors
    replace:
      - find: "`golemui.com/dx/<page>.md` (TS) vs `golemui.com/json/<page>.md` (JSON)"
        with: "`golemui.com/dx/<page>.md` (JSON) vs `golemui.com/json/<page>.md` (TS)"
    kills: [docs-url-json]
