name: shared-sync-check

# Guarantees the committed copies of /shared (src/_shared/ and the hotel core)
# match their source. Because StackBlitz serves demos straight from the repo,
# stale shared code must never reach main.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Regenerate shared files
        run: node scripts/sync-shared.mjs
      - name: Fail if a generated copy is out of date
        run: |
          paths=$(node scripts/sync-shared.mjs --paths)
          if [ -n "$(git status --porcelain -- $paths)" ]; then
            echo "::error::Copies of /shared are out of date. Run 'npm run sync' and commit the result."
            git status --short -- $paths
            git --no-pager diff -- $paths
            exit 1
          fi
          echo "Copies of /shared are up to date."
